ARG BUILD_IMAGE=container-registry.oracle.com/graalvm/native-image:25.0.1-muslib-ol9-20251021
ARG CORE_IMAGE=mcr.microsoft.com/azurelinux/base/core:3.0
# ARG CORE_IMAGE=mcr.microsoft.com/cbl-mariner/base/core:2.0-nonroot

# ---------------------------------------------------
# Build an artifact
# ---------------------------------------------------
FROM ${BUILD_IMAGE} AS build
RUN microdnf install maven
WORKDIR /app
ENV TMPDIR=/workspace/.tmp
RUN mkdir -p $TMPDIR
COPY pom.xml ./
COPY src ./src

RUN --mount=type=tmpfs,target=/tmp mvn clean package -Dpackaging=native-image -Pgraalvm -Dmaven.test.skip

# ---------------------------------------------------
# Build container
# ---------------------------------------------------
FROM ${CORE_IMAGE}

RUN useradd -r -u 10001 -g root app \
    && mkdir -p /app \
    && chown -R 10001:0 /app

WORKDIR /opt/app
USER 10001
COPY --from=build /app/target/headerchecker-0.1 ./app
EXPOSE 8080
ENTRYPOINT ["./app"]
